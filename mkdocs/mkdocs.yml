site_name: OBSERVER 2.0 — Code Docs
site_dir: ../_site
docs_dir: docs

theme:
  name: material
  language: it

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_signature_annotations: true
            show_root_heading: false
            show_root_toc_entry: false
            show_object_full_path: false
            show_root_full_path: false
            members_order: source
            heading_level: 3

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.details
  - admonition
  - pymdownx.snippets:
      base_path: [".", ".."]
      check_paths: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Documentazione progetto:
      - Panoramica: docset/index.md
      - README Docset: docset/000_README_DOCSET.md
      - Project Overview: docset/001_PROJECT_OVERVIEW.md
      - PDR: docset/002_PDR_OBSERVER.md
      - PDD: docset/003_PDD_OBSERVER.md
      - Data Dictionary: docset/004_DDT_DATADICTIONARY.md
      - Traceability Matrix: docset/005_TRACEABILITY_MATRIX.md
      - Repo BOM: docset/006_REPO_BOM.md
      - Parameter Snapshot: docset/007_PARAMETER_SNAPSHOT.md
      - Evidence Pack: docset/008_EVIDENCE_PACK.md
      - Gap Register: docset/009_GAP_REGISTER.md
      - PDF v1.2.5 (derivato): docset/OBSERVER_v1.2.5.pdf
      - Docset master (MD, derivato): docset/OBSERVER_v1.2.5.master.md
  - Moduli:
      - Panoramica: modules/index.md
      - Registro (canonico): modules/registry.md
      - Schede (generate): modules/_generated/index.md
      - PHASE1 (generate): modules/_generated/PHASE1.md
      - PHASE2 (generate): modules/_generated/PHASE2.md
  - Gap & Dipendenze:
      - Panoramica: gaps/index.md
      - Registro gap (canonico): gaps/register.md
      - Gap derivati (canonico): gaps/derived.md
  - Guide operative:
      - Architettura: guide/architecture.md
      - Runner: guide/runners.md
  - API (codice):
      - News Alpha: api/news_alpha.md
      - Sentinel: api/sentinel.md
      - Audit: api/audit.md
